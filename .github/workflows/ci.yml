name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: docent
          POSTGRES_PASSWORD: docent
          POSTGRES_DB: docent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docent -d docent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://docent:docent@localhost:5432/docent
      REDIS_URL: redis://localhost:6379
      # A placeholder, not a secret: config validation requires the variable to be
      # a non-empty string, and no test in this suite calls the OpenAI API.
      OPENAI_API_KEY: not-a-real-key
      # A placeholder, like the OpenAI one above: no test calls a provider,
      # and the suites that exercise the fallback build a two-link chain
      # pointing at a dead base URL. Config validation only requires the
      # variable to be a non-empty string.
      OPENROUTER_API_KEY: not-a-real-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run migrate
      - run: npm run test:e2e
